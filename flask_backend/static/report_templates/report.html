<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CrypticScan Report - {{ scan_id }}</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 24px;
			color: #1f2937;
			background: #f8fafc;
		}
		.container {
			max-width: 960px;
			margin: 0 auto;
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 10px;
			padding: 24px;
			box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
		}
		h1 {
			margin-top: 0;
			font-size: 24px;
		}
		.meta {
			margin-bottom: 20px;
			color: #4b5563;
		}
		.result-block {
			border: 1px solid #d1d5db;
			border-radius: 8px;
			margin-bottom: 16px;
			overflow: hidden;
		}
		.result-header {
			background: #111827;
			color: #f9fafb;
			padding: 10px 12px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			font-size: 12px;
		}
		pre {
			margin: 0;
			padding: 12px;
			background: #f9fafb;
			white-space: pre-wrap;
			word-break: break-word;
			font-size: 13px;
			line-height: 1.45;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>CrypticScan Vulnerability Report</h1>
		<div class="meta">
			<div><strong>Scan ID:</strong> {{ scan_id }}</div>
			<div><strong>Target:</strong> {{ target }}</div>
			<div><strong>Generated At:</strong> {{ generated_at }}</div>
		</div>

		{% if results_by_tool %}
			{% for tool, output in results_by_tool.items() %}
				<div class="result-block">
					<div class="result-header">{{ tool }}</div>
					<pre>{{ output }}</pre>
				</div>
			{% endfor %}
		{% else %}
			<p>No scan output was captured.</p>
		{% endif %}
	</div>
</body>
</html>
